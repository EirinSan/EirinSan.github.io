<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0xLoliAttack</title>
  <meta name="description" content="0xLoliAttack, team CTF francophone : membres, résultats et writeups.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="manline top">
    <span class="man-id">0XLOLIATTACK(7)</span>
    <span>Manuel de la team</span>
    <span class="man-id">0XLOLIATTACK(7)</span>
  </header>

  <main>
    <h2 id="nom">NOM</h2>
    <div class="body"><p><b data-team="name">0xLoliAttack</b> - <span data-team="tagline"></span></p></div>

    <h2 id="synopsis">SYNOPSIS</h2>
    <div class="body">
      <p class="synopsis"><b>0xloliattack</b>
        [<a href="#auteurs"><span class="opt">--membres</span></a>]
        [<a href="#historique"><span class="opt">--resultats</span></a>]
        [<a href="#fichiers"><span class="opt">--writeups</span></a>]
        [<a href="#contact"><span class="opt">--contact</span></a>]</p>
    </div>

    <h2 id="description">DESCRIPTION</h2>
    <div class="body">
      <p data-team="about"></p>
      <p>Catégories jouées : <span id="categories"></span>.</p>
    </div>

    <h2 id="auteurs">AUTEURS</h2>
    <div class="body"><dl id="member-list"></dl></div>

    <h2 id="historique">HISTORIQUE</h2>
    <div class="body" id="results"></div>

    <h2 id="fichiers">FICHIERS</h2>
    <div class="body">
      <p class="dim">writeups/</p>
      <div class="filters" id="writeup-filters"></div>
      <div class="ls scroll" id="writeup-list"></div>
    </div>

    <h2 id="contact">CONTACT</h2>
    <div class="body"><p data-team="join"></p></div>

    <h2 id="voir-aussi">VOIR AUSSI</h2>
    <div class="body"><p id="see-also"></p></div>

    <h2 id="bogues">BOGUES</h2>
    <div class="body"><p data-team="bugs"></p></div>
  </main>

  <footer class="manline bottom">
    <span data-team="name">0xLoliAttack</span>
    <span id="updated"></span>
    <span class="man-id">0XLOLIATTACK(7)</span>
  </footer>
</div>
<script src="assets/main.js"></script>
</body>
</html>
